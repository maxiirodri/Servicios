<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nombre de tu empresa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- HEADER: cambia el nombre de tu empresa aquí -->
  <header class="header">
    <h1 class="header__titulo">
      <a href="index.html">
        <img class="header__logo" src="Ya.png" alt="Nombre de tu empresa">
      </a>
    </h1>
  </header>

  <!-- MAIN: grid de productos -->
  <main class="productos">

    <!-- PRODUCTO (copia y pega este bloque <article> para agregar más) -->
    <article class="producto">
      <a href="index.html"><img class="producto__img" src="IMG_4681.JPG" alt="Descripción de la imagen del producto"></a>
      <div class="producto__texto">
        <h2 class="producto__titulo">Biotina</h2>
        <!-- <p class="producto__descripcion">Producto N°1.</p> -->
      </div>
    </article>

    <article class="producto">
      <img class="producto__img" src="IMG_4680.JPG" alt="Descripción de la imagen del producto">
      <div class="producto__texto">
        <h2 class="producto__titulo">Alisados</h2>
        <p class="producto__descripcion">1 LT.</p>
      </div>
    </article>

    <article class="producto">
      <img class="producto__img" src="IMG_4676.JPG" alt="Descripción de la imagen del producto">
      <div class="producto__texto">
        <h2 class="producto__titulo">Alisados</h2>
        <p class="producto__descripcion">500 ML.</p>
      </div>
    </article>

  </main>

  <!-- FOOTER: contactos y redes sociales -->
  <footer class="footer">
    <div class="footer__contacto">
      <h2 class="footer__titulo">Contáctanos</h2>
      <p>Teléfono: 000 000 0000</p>
      <p>Correo: correo@tuempresa.com</p>
    </div>

    <!-- Reemplaza cada href="#" por tu enlace -->
    <nav class="redes" aria-label="Redes sociales">
      <a class="redes__enlace" href="#" aria-label="Facebook">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h-2a4 4 0 0 0-4 4v3H6v4h3v7h4v-7h3l1-4h-4V7a1 1 0 0 1 1-1h2z"/></svg>
      </a>
      <a class="redes__enlace" href="#" aria-label="WhatsApp">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21l1.6-4.7A8.5 8.5 0 1 1 8 19.6L3 21z"/><path d="M9 9.5c.3 2 2.5 4.2 4.5 4.5l1.2-1.2-1.8-1-.8.6c-.8-.4-1.600-1.200-2-2l.6-.8-1-1.800z"/></svg>
      </a>
      <a class="redes__enlace" href="#" aria-label="TikTok">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3v11.500a3.500 3.500 0 1 1-3.500-3.500"/><path d="M14 3c.3 2.500 2 4.200 5 4.500"/></svg>
      </a>
    </nav>
  </footer>

</body>
</html>
